name: Evening Warning Check

on:
  schedule:
    # 18:00 UTC = 11:00 PM PKT (primary)
    - cron: '0 18 * * *'
    # 18:20 UTC = backup, in case the primary run is delayed/skipped by GitHub
    - cron: '20 18 * * *'
  workflow_dispatch: {}

jobs:
  warning-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run warning check
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python .github/scripts/warning_check.py