name: Daily LeetCode Summary

on:
  schedule:
    # 18:00 UTC = 11:00 PM PKT (Pakistan is UTC+5, no daylight saving)
    - cron: '0 18 * * *'
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab to test

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need full commit history, not just the latest commit

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install gspread google-auth

      - name: Run daily summary
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPENT_EMAIL }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEET
          _CREDENTIALS }}
        run: python .github/scripts/daily_summary.py